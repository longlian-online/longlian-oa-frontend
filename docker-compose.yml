name: longlian-oa-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: longlian-oa-frontend:dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
    init: true

volumes:
  web_node_modules:
